[project]
name = "sp1-django"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "django-cleanup>=9.0.0",
    "django-debug-toolbar>=8.0.0",
    "faker>=40.40.0",
    "pillow>=12.3.0",
    "sorl-thumbnail>=13.1.0",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.1",
    "mypy>=2.3.1",
    "ruff>=0.16.9",
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["RUF012"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
strict = true

[[tool.mypy.overrides]]
module = [
    "sorl.*",
]
ignore_missing_imports = true
[tool.django-stubs]
django_settings_module = "sp1_demo.settings"
